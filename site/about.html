<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عن صادكو — صادكو جروب</title>
<meta name="description" content="صادكو جروب: تأسست سنة 1986 على يد المهندس صادق حنّا غبور لتكون الموزّع الرئيسى للصناعة المصرية، والموزّع الحصرى لكريازى — الحكاية والوصول. وقيمنا وطريقة شغلنا فى صفحة قيمنا.">
<link rel="icon" href="assets/img/sadko-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css?v=a7">
<style>
/* about page — editorial layout only, built on the app.css tokens */
.ab-sec { margin-top: clamp(26px,4vw,44px); }
.ab-h { font-size: clamp(1.2rem,2.7vw,1.55rem); font-weight: 900; margin: 0 0 6px; line-height: 1.35; }
.ab-sub { color: var(--ink-soft); font-weight: 700; line-height: 1.85; margin: 0 0 18px; max-width: 72ch; }
.ab-lead { font-size: clamp(1rem,2.2vw,1.12rem); line-height: 2.05; font-weight: 700; margin: 0 0 14px; max-width: 74ch; }
.ab-p { font-size: .95rem; line-height: 1.95; font-weight: 600; margin: 0 0 12px; max-width: 74ch; }
.ab-p:last-child { margin-bottom: 0; }

.pull { margin: 0; padding: 16px 20px; border-radius: 14px; border-inline-start: 4px solid var(--amber);
  background: color-mix(in srgb, var(--amber) 8%, #fff); font-size: clamp(.98rem,2.1vw,1.1rem);
  font-weight: 800; line-height: 1.95; }
.pull cite { display: block; margin-top: 9px; font: 700 .8rem 'Cairo', sans-serif; font-style: normal; color: var(--ink-soft); }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ''; position: absolute; inset-block: 8px 12px; inset-inline-start: 9px; width: 2px;
  background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 12%, transparent)); }
.tl > li { position: relative; padding-inline-start: 34px; padding-bottom: 24px; }
.tl > li:last-child { padding-bottom: 0; }
.tl i { position: absolute; inset-inline-start: 0; top: 4px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; border: 3px solid var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 9%, transparent); }
.tl .yr { display: block; font: 900 .86rem 'Cairo', sans-serif; color: var(--accent); letter-spacing: .04em; }
.tl h3 { margin: 3px 0 6px; font-size: 1.02rem; font-weight: 900; line-height: 1.5; }
.tl p { margin: 0; font-size: .92rem; line-height: 1.9; font-weight: 600; color: var(--ink-soft); max-width: 68ch; }

/* reach */
.stats { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%,175px), 1fr)); }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 14px;
  text-align: center; box-shadow: var(--shadow); }
.stat b { display: block; font-size: clamp(1.45rem,3.4vw,2rem); font-weight: 900; color: var(--accent); line-height: 1.2; }
.stat span { display: block; margin-top: 6px; font-size: .83rem; font-weight: 700; color: var(--ink-soft); line-height: 1.65; }

.ab-cta { text-align: center; }
.ab-cta .chips, .ab-cta .row { justify-content: center; }
.wrap :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
</style>
</head>
<body>

<section class="phero">
  <div class="phero__inner">
    <p class="phero__crumb"><a href="index.html" data-i18n="crumb-home">البيت</a> ← <span data-i18n="crumb-here">عن صادكو</span></p>
    <h1 class="phero__title" data-i18n="title">عن صادكو</h1>
    <p class="phero__sub" data-i18n="sub">شركة مصرية بدأت سنة 1986 بفكرة واحدة: إن الصناعة المحلية تستاهل موزّعاً يقف جنبها،
      وإن البيت المصرى يستاهل جهازاً يعيش معاه سنين. من ساعتها واحنا بنبيع الأجهزة المنزلية والكهربائية،
      وبنفضل موجودين بعد ما الجهاز يدخل البيت.</p>
  </div>
</section>

<main class="wrap" id="about-root">
  <div class="empty" data-i18n="loading">جارى التحميل…</div>
</main>

<footer data-footer></footer>

<script src="assets/js/nav.js?v=g23" defer></script>
<script src="assets/js/appshell.js?v=a5" defer></script>
<script src="assets/js/about.js?v=a5" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const T = {
    'crumb-home': 'Home', 'crumb-here': 'About SADKO',
    'title': 'About SADKO',
    'sub': 'An Egyptian company that started in 1986 with a single idea: that local industry deserves a distributor who stands beside it, and that the Egyptian home deserves an appliance that lasts for years. Since then we have been selling home and electrical appliances — and staying present after the appliance is in the house.',
    'loading': 'Loading…',
  };
  if (window.skLang && window.skLang.get() === 'en') {
    document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr';
    document.title = 'About SADKO — SADKO Group';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n'); if (T[k]) el.innerHTML = T[k];
    });
  }
  skApp.footer();
  mountAbout(document.getElementById('about-root'));
});
</script>
</body>
</html>
