<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>من نحن | صادكو جروب</title>
<meta name="description" content="صادكو: شركة عائلية مصرية تأسست عام ١٩٨٦، ومجموعة أعمال متنوعة فى التجارة والتجزئة والتوزيع والتصنيع والخدمات والمبادرات المجتمعية. رؤيتنا ورسالتنا وقيمنا.">
<link rel="icon" href="assets/img/sadko-logo-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css?v=a13">
<style>
/* about page — editorial layout only, built on the app.css tokens */
.ab-sec { margin-top: clamp(26px,4vw,44px); }
.ab-h { font-size: clamp(1.2rem,2.7vw,1.55rem); font-weight: 900; margin: 0 0 6px; line-height: 1.35; }
.ab-sub { color: var(--ink-soft); font-weight: 700; line-height: 1.85; margin: 0 0 18px; max-width: 72ch; }
.ab-lead { font-size: clamp(1rem,2.2vw,1.12rem); line-height: 2.05; font-weight: 700; margin: 0 0 14px; max-width: 74ch; }
.ab-p { font-size: .95rem; line-height: 1.95; font-weight: 600; margin: 0 0 12px; max-width: 74ch; }
.ab-p:last-child { margin-bottom: 0; }

.pull { margin: 0; padding: 16px 20px; border-radius: 14px; border-inline-start: 4px solid var(--amber);
  background: color-mix(in srgb, var(--amber) 8%, #fff); font-size: clamp(.98rem,2.1vw,1.1rem);
  font-weight: 800; line-height: 1.95; }
.pull cite { display: block; margin-top: 9px; font: 700 .8rem 'Cairo', sans-serif; font-style: normal; color: var(--ink-soft); }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: ''; position: absolute; inset-block: 8px 12px; inset-inline-start: 9px; width: 2px;
  background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 12%, transparent)); }
.tl > li { position: relative; padding-inline-start: 34px; padding-bottom: 24px; }
.tl > li:last-child { padding-bottom: 0; }
.tl i { position: absolute; inset-inline-start: 0; top: 4px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; border: 3px solid var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 9%, transparent); }
.tl .yr { display: block; font: 900 .86rem 'Cairo', sans-serif; color:var(--accent-ink); letter-spacing: .04em; }
.tl h3 { margin: 3px 0 6px; font-size: 1.02rem; font-weight: 900; line-height: 1.5; }
.tl p { margin: 0; font-size: .92rem; line-height: 1.9; font-weight: 600; color: var(--ink-soft); max-width: 68ch; }

/* reach */
.stats { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%,175px), 1fr)); }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 14px;
  text-align: center; box-shadow: var(--shadow); }
.stat b { display: block; font-size: clamp(1.45rem,3.4vw,2rem); font-weight: 900; color:var(--accent-ink); line-height: 1.2; }
.stat span { display: block; margin-top: 6px; font-size: .83rem; font-weight: 700; color: var(--ink-soft); line-height: 1.65; }

.ab-cta { text-align: center; }
.ab-cta .chips, .ab-cta .row { justify-content: center; }
.wrap :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
/* merged About + Values page (2026-10-31) */
.ab-eyebrow { margin: 0 0 6px; font: 800 .95rem 'Cairo', sans-serif; color: var(--accent-ink); }
.ab-h3 { margin: 0 0 10px; font-size: 1rem; font-weight: 900; }
.ab-sectors { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.ab-sectors li { padding: 7px 14px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 30%, #fff);
  border: 1px solid color-mix(in srgb, var(--accent) 70%, #fff); font-weight: 800; font-size: .9rem; color: var(--ink); }
.ab-sign p { margin: 0; text-align: center; font-size: clamp(1.15rem, 2.8vw, 1.5rem); font-weight: 900; }
.ab-sign { border-inline-start: 0; border-block: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 16%, #fff); }
.ab-vm { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.ab-card .ab-p { margin: 0; }
.ab-values { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.ab-value { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 16px 16px; box-shadow: var(--shadow); border-top: 4px solid var(--accent); }
.ab-value__n { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent); color:#14343a; font: 900 .85rem 'Cairo', sans-serif; }
.ab-value h3 { margin: 10px 0 6px; font-size: 1.08rem; font-weight: 900; }
/* the values artwork: a vintage print in a carved gold frame */
.ab-gallery { display: flex; justify-content: center; padding: clamp(10px, 3vw, 34px) 0;
  background: radial-gradient(60% 70% at 50% 45%, rgba(255, 236, 190, .55), transparent 75%); }
.ab-frame { position: relative; margin: 0; width: min(100%, 980px); padding: clamp(14px, 2.4vw, 30px);
  border-radius: 4px;
  background:
    linear-gradient(135deg, #6b4512 0%, #c99a3d 14%, #f7e2a0 27%, #b98a30 41%, #e9c86e 55%, #8c6520 71%, #dcb25a 86%, #6b4512 100%);
  box-shadow:
    inset 0 0 0 2px #4a300a, inset 0 0 0 5px #f0d68a, inset 0 0 0 7px #7a5418,
    inset 0 0 0 11px #c99a3d, inset 0 0 0 13px #5a3b0c,
    0 26px 50px rgba(45, 28, 6, .38), 0 6px 14px rgba(45, 28, 6, .28);
  transform: rotate(-.4deg); transition: transform .35s ease, box-shadow .35s ease; }
.ab-frame:hover { transform: rotate(0deg) translateY(-3px);
  box-shadow:
    inset 0 0 0 2px #4a300a, inset 0 0 0 5px #f0d68a, inset 0 0 0 7px #7a5418,
    inset 0 0 0 11px #c99a3d, inset 0 0 0 13px #5a3b0c,
    0 34px 60px rgba(45, 28, 6, .42), 0 8px 18px rgba(45, 28, 6, .3); }
/* carved rosettes on the four corners */
.ab-frame::before { content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  --r: clamp(16px, 2.6vw, 30px);
  background:
    radial-gradient(circle at var(--r) var(--r), #fff3c4 0 18%, #b8862b 30%, #f2d483 42%, #7a5418 56%, transparent 60%) top left / calc(var(--r) * 2) calc(var(--r) * 2) no-repeat,
    radial-gradient(circle at calc(100% - var(--r)) var(--r), #fff3c4 0 18%, #b8862b 30%, #f2d483 42%, #7a5418 56%, transparent 60%) top right / calc(var(--r) * 2) calc(var(--r) * 2) no-repeat,
    radial-gradient(circle at var(--r) calc(100% - var(--r)), #fff3c4 0 18%, #b8862b 30%, #f2d483 42%, #7a5418 56%, transparent 60%) bottom left / calc(var(--r) * 2) calc(var(--r) * 2) no-repeat,
    radial-gradient(circle at calc(100% - var(--r)) calc(100% - var(--r)), #fff3c4 0 18%, #b8862b 30%, #f2d483 42%, #7a5418 56%, transparent 60%) bottom right / calc(var(--r) * 2) calc(var(--r) * 2) no-repeat; }
.ab-frame__mat { display: block; padding: clamp(10px, 1.8vw, 22px); background: #f3ead4;
  box-shadow: inset 0 0 0 1px #b8892c, inset 0 0 0 4px #f3ead4, inset 0 0 0 5px #d8b867, inset 0 4px 12px rgba(70, 45, 10, .35); }
.ab-frame__mat img { display: block; width: 100%; height: auto; filter: sepia(.2) contrast(1.03);
  box-shadow: 0 0 0 1px rgba(60, 40, 10, .35), 0 2px 8px rgba(60, 40, 10, .25); }
.ab-plaque { position: absolute; left: 50%; bottom: calc(-1 * clamp(16px, 2.2vw, 22px)); transform: translateX(-50%);
  padding: 6px 20px; border-radius: 4px; white-space: nowrap;
  background: linear-gradient(180deg, #f8e6a6, #c9973a 60%, #a8781f); color: #3a2706;
  font: 800 .82rem 'Cairo', sans-serif; letter-spacing: .02em;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .65), inset 0 -1px 0 rgba(80, 50, 10, .4), 0 3px 8px rgba(45, 28, 6, .35); }
@media (prefers-reduced-motion: reduce) { .ab-frame, .ab-frame:hover { transform: none; transition: none; } }
.ab-value p { margin: 0; font-size: .92rem; line-height: 1.85; font-weight: 600; color: var(--ink-soft); }
</style>
</head>
<body>

<section class="phero">
  <div class="phero__inner">
    <p class="phero__crumb"><a href="./" data-i18n="crumb-home">الرئيسية</a> ← <span data-i18n="crumb-here">من نحن</span></p>
    <h1 class="phero__title" data-i18n="title">من نحن</h1>
    <p class="phero__sub" data-i18n="sub">٤٠ عامًا من بناء الثقة، والتواصل بين الناس، وصناعة القيمة.</p>
  </div>
</section>

<main class="wrap" id="about-root">
  <div class="empty" data-i18n="loading">جارى التحميل…</div>
</main>

<footer data-footer></footer>

<script src="assets/js/nav.js?v=g42" defer></script>
<script src="assets/js/appshell.js?v=a15" defer></script>
<script src="assets/js/about.js?v=a9" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const T = {
    'crumb-home': 'Home', 'crumb-here': 'About us',
    'title': 'About us',
    'sub': '40 Years of Building Trust. Connecting People. Creating Value.',
    'loading': 'Loading…',
  };
  if (window.skLang && window.skLang.get() === 'en') {
    document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr';
    document.title = 'About us | SADKO Group';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n'); if (T[k]) el.innerHTML = T[k];
    });
  }
  skApp.footer();
  mountAbout(document.getElementById('about-root'));
});
</script>
</body>
</html>
