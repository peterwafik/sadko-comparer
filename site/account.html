<body>

<section class="phero">
  <div class="phero__inner">
    <p class="phero__crumb"><a href="index.html" data-i18n="crumb-home">البيت</a> ← <span data-i18n="crumb-here">حسابى</span></p>
    <h1 class="phero__title" data-i18n="title">حسابى</h1>

<footer data-footer></footer>

<script src="assets/js/account.js?v=a6" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const T = { 'crumb-home':'Home','crumb-here':'My account','title':'My account',
    'sub':'An account lets you place and follow an order. And if you tell us a little about your home, we can hide appliances that will not suit you on every page — entirely optional.',
    'loading':'Loading…' };
  if (window.skLang && window.skLang.get() === 'en') {
    document.documentElement.lang='en'; document.documentElement.dir='ltr';
    document.title='My account — SADKO Group';
    document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n'); if(T[k]) el.innerHTML=T[k];});
  }
  skApp.footer();
  mountAccount(document.getElementById('account-root'));
});
</script>
