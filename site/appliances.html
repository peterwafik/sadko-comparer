<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أجهزتى والضمان — صادكو جروب</title>
<meta name="description" content="سجّل الأجهزة التى لديك، واعرف كم يوماً بقى من الضمان، واحفظ مرجع الفاتورة، وتلقَّ تذكيرات صيانة بحسب نوع كل جهاز — دون حساب ولا تسجيل.">
<link rel="icon" href="assets/img/sadko-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css?v=a7">
<style>
/* page-specific: the appliance card header (thumbnail + title block) */
.ap__top { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: start; }
.ap__img { width: 92px; height: 92px; border: 1px solid var(--line); border-radius: 14px;
  background: #fff; display: grid; place-items: center; overflow: hidden; font-size: 1.6rem; }
.ap__img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.ap .specs li { gap: 10px; }
@media (max-width: 480px) { .ap__top { grid-template-columns: 64px 1fr; } .ap__img { width: 64px; height: 64px; } }
</style>
</head>
<body>

<section class="phero">
  <div class="phero__inner">
    <p class="phero__crumb"><a href="index.html" data-i18n="crumb-home">الرئيسية</a> ← <span data-i18n="crumb-here">أجهزتى</span></p>
    <h1 class="phero__title" data-i18n="title">أجهزتى والضمان</h1>
    <p class="phero__sub" data-i18n="sub">سجّل الأجهزة التى لديك — سواء اشتريتها من صادكو أو من مكان آخر — ونحسب لك
      <strong>كم يوماً بقى من الضمان</strong> من تاريخ الشراء، ونذكّرك بمواعيد الصيانة المناسبة لكل نوع جهاز.
      وكل ذلك محفوظ على جهازك أنت، دون حساب ولا تسجيل.</p>
  </div>
</section>

<main class="wrap" id="appliances-root">
  <div class="empty" data-i18n="loading">جارى التحميل…</div>
</main>

<footer data-footer></footer>

<script src="assets/js/nav.js?v=g24" defer></script>
<script src="assets/js/appshell.js?v=a6" defer></script>
<script src="assets/js/specs.js?v=a4" defer></script>
<script src="assets/js/store.js?v=a5" defer></script>
<script src="assets/js/auth.js?v=a5" defer></script>
<script src="assets/js/homes.js?v=a5" defer></script>
<script src="assets/js/prefs.js?v=a6" defer></script>
<script src="assets/js/appliances.js?v=a5" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const T = {
    'crumb-home': 'Home', 'crumb-here': 'My appliances',
    'title': 'My appliances & warranty',
    'sub': 'Record the appliances you own — whether you bought them from SADKO or somewhere else — and we will work out <strong>how many days of warranty are left</strong> from the purchase date, and remind you when each type of appliance is due for maintenance. All of it stays on your own device, with no account and no sign-up.',
    'loading': 'Loading…',
  };
  if (window.skLang && window.skLang.get() === 'en') {
    document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr';
    document.title = 'My appliances & warranty — SADKO Group';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n'); if (T[k]) el.innerHTML = T[k];
    });
  }
  skApp.footer();
  mountAppliances(document.getElementById('appliances-root'));
});
</script>
</body>
</html>
