<script>
window.addEventListener('DOMContentLoaded', () => {
  const T = {
    'crumb-home': 'Home', 'crumb-here': 'Help me choose',
    'title': 'Help me choose the right appliance',
    'sub': 'You do not need to understand technical specifications. Answer a few questions about your home and how you use it, and we will suggest three options (lowest suitable price, best balanced choice, and a higher-feature choice), each explaining <strong>why</strong>, not just a percentage.',
    'loading': 'Loading…',
  };
  if (window.skLang && window.skLang.get() === 'en') {
    document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr';
    document.title = 'Help me choose | SADKO Group';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n'); if (T[k]) el.innerHTML = T[k];
    });
  }
  skApp.footer();
  mountFinder(document.getElementById('finder-root'));
});
