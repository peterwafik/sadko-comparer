<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صادكو جروب — بيتك بالكامل</title>
<meta name="description" content="اتجوّل جوه بيت صادكو — كل فئات الأجهزة الكهربائية فى ثلاث أوض، وفى الآخر تدخل المتجر على طول. اضغط على أى جهاز وتسوّق من فئته مباشرة.">
<link rel="icon" href="assets/img/sadko-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="assets/js/scrub-engine.js?v=g22" defer></script>
<script src="assets/js/nav.js?v=g18" defer></script>
<script src="assets/js/catalog-i18n.js?v=g2" defer></script>
<script src="assets/js/hotspots.js?v=g25" defer></script>
<script src="assets/js/guide.js?v=g4" defer></script>
<link rel="stylesheet" href="assets/css/site.css?v=g14">
</head>
<body>
<div id="world"></div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const C = id => `category/${id}.html`;
  const OFFERS = C('173607281');   // fallback shop page for world-categories SADKO
                                   // doesn't list yet (soundbars, heaters, …)

  const SECTIONS = [
    {
      id: 'living', label: 'غرفة المعيشة',
      still: 'assets/img/still_1.jpg',
      stillMobile: 'assets/img/m_living.jpg',   // bespoke portrait scene for phones
      clip: 'assets/vid/leg_1.mp4', clipMobile: 'assets/vid/leg_1-m.mp4',
      accent: '#2e7e88',
      scroll: 1.9, linger: 0.5,
      copyY: 0.46,      // mid-height: clears the top-right AC and the bottom heaters
      mCopyX: 0.50, mCopyY: 0.20,   // phone: standardized top-centre position (same in every room)
      eyebrow: 'بيتك بالكامل من صادكو',
      title: 'أهلاً بيك فى بيت صادكو',
      showcase: 0.03,   // the landing frame — the whole entertainment + climate room
      // fx/fy = desktop 16:9 frame; mfx/mfy = the portrait m_living.jpg (same appliances)
      hotspots: [       // coords measured on the settle frame (sc_living @0.46s)
        { fx: 0.500, fy: 0.514, at: 0.06, span: 0.30, mfx: 0.490, mfy: 0.485, label: 'تليفزيونات', href: C('38022381') },
        { fx: 0.413, fy: 0.606, at: 0.06, span: 0.30, mfx: 0.655, mfy: 0.550, label: 'أنظمة صوت وترفيه', href: OFFERS },
        { fx: 0.885, fy: 0.167, at: 0.06, span: 0.30, mfx: 0.910, mfy: 0.345, label: 'تكييفات هواء', href: C('38032005') },
        { fx: 0.619, fy: 0.648, at: 0.12, span: 0.32, sfx: 0.619, sfy: 0.648, mfx: 0.815, mfy: 0.660, label: 'مراوح ومبردات هواء', href: C('50318054') },
        { fx: 0.773, fy: 0.815, at: 0.12, span: 0.32, sfx: 0.773, sfy: 0.815, mfx: 0.610, mfy: 0.740, label: 'دفايات', href: OFFERS },
        { fx: 0.060, fy: 0.690, at: 0.20, span: 0.32, sfx: 0.060, sfy: 0.690, mfx: 0.685, mfy: 0.575, label: 'تنقية وترطيب الهواء', href: OFFERS },
        { fx: 0.371, fy: 0.597, at: 0.20, span: 0.32, sfx: 0.371, sfy: 0.597, mfx: 0.310, mfy: 0.525, label: 'مبردات مياه', href: C('102858075') },
      ],
    },
    {
      id: 'kitchen', label: 'المطبخ',
      still: 'assets/img/still_2.jpg',
      stillMobile: 'assets/img/m_kitchen.jpg',
      clip: 'assets/vid/leg_2.mp4', clipMobile: 'assets/vid/leg_2-m.mp4',
      accent: '#c97b12',
      scroll: 2.1, linger: 0.5,
      copyY: 0.24,      // top: every marker (fridges right, counter left) sits lower-half
      copyAt: 0.92,     // peak the copy ON the settle frame (= showcase), not mid-flight:
                        // this room settles late, so a mid-section peak had the title
                        // shouting on the way in and faded out by the view it describes
      mCopyX: 0.50, mCopyY: 0.20,   // phone: standardized top-centre position (same in every room)
      eyebrow: 'قلب البيت',
      title: 'مطبخ فيه كل حاجة… حرفيًا',
      showcase: 0.92,   // the settle: full counter line-up + cooker wall + cold corner
      hotspots: [
        { fx: 0.098, fy: 0.638, at: 0.92, span: 0.26, mfx: 0.070, mfy: 0.556, label: 'ميكروييف', href: C('57646037') },
        { fx: 0.180, fy: 0.574, at: 0.92, span: 0.26, mfx: 0.090, mfy: 0.710, label: 'خلاطات', href: C('68782006') },
        { fx: 0.218, fy: 0.607, at: 0.92, span: 0.26, mfx: 0.220, mfy: 0.532, label: 'كاتيل وماكينات قهوة', href: C('185355010') },
        { fx: 0.333, fy: 0.551, at: 0.92, span: 0.26, mfx: 0.290, mfy: 0.526, label: 'قلايات', href: C('185364502') },
        { fx: 0.378, fy: 0.570, at: 0.92, span: 0.26, mfx: 0.350, mfy: 0.524, label: 'أجهزة صغيرة', href: C('112439376') },
        { fx: 0.424, fy: 0.565, at: 0.92, span: 0.26, mfx: 0.400, mfy: 0.520, label: 'عجانات', href: C('68782006') },
        { fx: 0.494, fy: 0.546, at: 0.92, span: 0.26, mfx: 0.500, mfy: 0.525, label: 'محضرات طعام', href: C('68782006') },
        { fx: 0.538, fy: 0.546, at: 0.92, span: 0.26, mfx: 0.550, mfy: 0.512, label: 'عصارات', href: C('112439376') },
        { fx: 0.594, fy: 0.570, at: 0.92, span: 0.26, mfx: 0.620, mfy: 0.538, label: 'جريل وتوستر', href: C('112439376') },
        { fx: 0.346, fy: 0.722, at: 0.92, span: 0.26, mfx: 0.330, mfy: 0.585, label: 'غسالات أطباق', href: C('38022354') },
        { fx: 0.494, fy: 0.700, at: 0.92, span: 0.26, mfx: 0.490, mfy: 0.588, label: 'أفران وبوتاجازات', href: C('38003799') },
        { fx: 0.497, fy: 0.398, at: 0.92, span: 0.26, mfx: 0.470, mfy: 0.452, label: 'شفاطات', href: C('38003799') },
        { fx: 0.813, fy: 0.574, at: 0.92, span: 0.26, mfx: 0.840, mfy: 0.505, label: 'ثلاجات', href: C('38003882') },
        { fx: 0.903, fy: 0.607, at: 0.92, span: 0.26, mfx: 0.915, mfy: 0.680, label: 'حلل كهربائية ومفارم', href: C('112439376') },
        { fx: 0.909, fy: 0.750, at: 0.92, span: 0.26, mfx: 0.795, mfy: 0.560, label: 'فريزرات', href: C('38005648') },
      ],
    },
    {
      id: 'laundry', label: 'غرفة الغسيل',
      still: 'assets/img/still_3.jpg',
      stillMobile: 'assets/img/m_laundry.jpg',
      clip: 'assets/vid/leg_3.mp4', clipMobile: 'assets/vid/leg_3-m.mp4',
      accent: '#3d7f9e',
      scroll: 1.8, linger: 0.45,
      // Both side walls of this room are packed (ironing corner left, washer bay +
      // heaters + shelving right), so the copy goes on the one big bare patch:
      // the wall above the washer/dryer counter. Same spot in both languages.
      copyX: 0.55, copyY: 0.22,
      mCopyX: 0.50, mCopyY: 0.20,   // phone: standardized top-centre position (same in every room)
      eyebrow: 'ركن الغسيل والعناية',
      title: 'غسيل وتجفيف ونضافة… وكل حاجة معاها',
      showcase: 0.50,   // the full-room view: fabric care, cleaning trio, heaters, shelves
      // Coords read off the actual showcase frame (leg_3.mp4 @ 4.02s, 1920×1080).
      // The portrait m_laundry.jpg has ONE machine: washer + dryer markers both sit
      // on it, side by side (the user's request).
      hotspots: [
        { fx: 0.655, fy: 0.699, at: 0.50, span: 0.28, mfx: 0.600, mfy: 0.620, label: 'غسالات ملابس', href: C('38003963') },
        { fx: 0.549, fy: 0.699, at: 0.50, span: 0.28, mfx: 0.710, mfy: 0.620, label: 'مجففات ملابس', href: C('38005652') },
        { fx: 0.760, fy: 0.269, at: 0.50, span: 0.28, mfx: 0.720, mfy: 0.340, label: 'سخانات غاز', href: C('48143206') },
        { fx: 0.836, fy: 0.167, at: 0.50, span: 0.28, mfx: 0.850, mfy: 0.260, label: 'سخانات كهرباء', href: C('48149056') },
        { fx: 0.258, fy: 0.560, at: 0.50, span: 0.28, mfx: 0.140, mfy: 0.550, label: 'مكاوى', href: C('81167227') },
        { fx: 0.321, fy: 0.375, at: 0.50, span: 0.28, mfx: 0.290, mfy: 0.440, label: 'مكاوى بخار وستيمر', href: C('81167227') },
        { fx: 0.379, fy: 0.694, at: 0.50, span: 0.28, mfx: 0.440, mfy: 0.635, label: 'مكانس', href: C('81170222') },
        { fx: 0.464, fy: 0.497, at: 0.50, span: 0.28, mfx: 0.340, mfy: 0.720, label: 'مكانس روبوت وعمودية', href: C('81170222') },
        { fx: 0.846, fy: 0.540, at: 0.50, span: 0.28, mfx: 0.900, mfy: 0.545, label: 'ماكينات خياطة', href: OFFERS },
        { fx: 0.747, fy: 0.546, at: 0.50, span: 0.28, mfx: 0.670, mfy: 0.530, label: 'عناية شخصية', href: C('112439376') },
      ],
    },
    {
      // The offers room is gone. This last section is the hand-off to the shop:
      // the laundry flight starts, and is CUT before it arrives — clipEnd 0.30 is
      // just under the frame where the old room's gallery wall first reads
      // (frame 42 of 151 = 0.28), so the reader never sees a room they cannot
      // enter. From `outro.from` the stage fades out and the browser goes to
      // shop.html. See the outro block in scrub-engine.js for the two guards.
      id: 'shop', label: 'المتجر',
      href: 'shop.html',            // the dock button navigates instead of framing
      // still_shop.jpg is leg_4 at exactly clipEnd (1.109s of 5.042s) — the doorway
      // out of the laundry, before the offers room resolves. It MUST match the cut:
      // the still is what shows until the clip decodes, so still_4.jpg (the offers
      // room itself) put the deleted room straight back on screen.
      still: 'assets/img/still_shop.jpg',
      // Portrait has no video to cut, so it must not use the offers-room still at
      // all — it holds the laundry frame and dissolves straight into the fade.
      stillMobile: 'assets/img/m_laundry.jpg',
      clip: 'assets/vid/leg_4.mp4', clipMobile: 'assets/vid/leg_4-m.mp4',
      clipEnd: 0.22,
      accent: '#8a6242',
      scroll: 1.1, linger: 0,
      copyY: 0.5,
      mCopyX: 0.50, mCopyY: 0.20,
      eyebrow: 'كل اللى شوفته… وأكتر',
      title: 'ادخل المتجر',
      showcase: 0.22,
      showcaseLabel: 'تسوّق كل المنتجات',
      hotspots: [],
    },
  ];

  /* ---- English mode: overlay the scene copy (labels, titles, hotspot names)
     onto the Arabic-authored config. Language comes from nav.js (skLang). ---- */
  const EN = !!(window.skLang && window.skLang.get() === 'en');
  if (EN) {
    document.documentElement.lang = 'en';
    document.documentElement.dir = 'ltr';
    document.title = 'SADKO Group — Your Whole Home';
    const L = {
      living: { label: 'Living Room', eyebrow: 'Your whole home from SADKO', title: 'Welcome to the SADKO house',
        spots: ['TVs', 'Sound & entertainment', 'Air conditioners', 'Fans & air coolers', 'Space heaters', 'Air purifiers & humidifiers', 'Water dispensers'] },
      kitchen: { label: 'Kitchen', eyebrow: 'The heart of the home', title: 'A kitchen with everything… literally',
        spots: ['Microwaves', 'Blenders', 'Kettles & coffee machines', 'Air fryers', 'Small appliances', 'Dough mixers', 'Food processors', 'Juicers', 'Grills & toasters', 'Dishwashers', 'Ovens & cookers', 'Hoods', 'Refrigerators', 'Electric pots & choppers', 'Freezers'] },
      laundry: { label: 'Laundry Room', eyebrow: 'Laundry & care corner', title: 'Washing, drying, cleaning… and everything with it',
        // no anchor override: this room's copy sits on the bare centre wall in
        // both languages (copyX/copyY above), since both side walls are packed
        spots: ['Washing machines', 'Clothes dryers', 'Gas water heaters', 'Electric water heaters', 'Irons', 'Steam irons & steamers', 'Vacuum cleaners', 'Robot & stick vacuums', 'Sewing machines', 'Personal care'] },
      shop: { label: 'Shop', eyebrow: 'Everything you just saw… and more', title: 'Enter the shop',
        showcaseLabel: 'Shop all products',
        spots: [] },
    };
    for (const s of SECTIONS) {
      const e = L[s.id]; if (!e) continue;
      s.label = e.label; s.eyebrow = e.eyebrow; s.title = e.title;
      if (e.copyY != null) s.copyY = e.copyY;   // English copy sits on the left; some rooms need a different anchor
      if (e.showcaseLabel) s.showcaseLabel = e.showcaseLabel;
      (s.hotspots || []).forEach((h, i) => { if (e.spots[i]) h.label = e.spots[i]; });
      if (s.cta && e.cta) { s.cta.primary.label = e.cta.primary; s.cta.secondary.label = e.cta.secondary; }
    }
  }

  const api = mountScrollWorld(document.getElementById('world'), {
    nav: false,               // core-pages strap comes from nav.js; rooms live in the dock
    hint: EN ? 'Scroll to enter the house' : 'اسحب لتدخل البيت',
    diveScroll: 1.5,
    connScroll: 0.9,
    crossfade: 0.1,
    sections: SECTIONS,
    // Hand off to the shop at the end of the last (cut) leg. `from` is the point
    // in that section's scroll where the fade begins; it completes at the end of
    // the section, and that is when the browser follows `href`.
    outro: { href: 'shop.html', from: 0.55 },
    connectors: [],            // architecture A: legs chain directly, no connectors
    connectorsMobile: [],
  });

  mountHotspots(document.getElementById('world'), api, SECTIONS);

  // The rotating offers board used to hang on the family room's gallery wall.
  // That room is no longer reached — the flight is cut before it — so there is
  // nothing to mount it onto. Its content lives on in the shop's own "Hot offers"
  // and "Best sellers" rails, which are built from the same SADKO source lists
  // (see data/collections.json).

  mountGuide(document.getElementById('world'), api, SECTIONS);
  window.__swApi = api;   // exposed for QA tooling (?spots etc.)
});
</script>
</body>
</html>
