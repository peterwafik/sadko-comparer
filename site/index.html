<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="icon" href="assets/img/sadko-logo.png">

<script src="assets/js/scrub-engine.js?v=g16" defer></script>
<script src="assets/js/nav.js?v=g17" defer></script>
<script src="assets/js/catalog-i18n.js?v=g2" defer></script>

<body>
<div id="world"></div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const C = id => `category/${id}.html`;
  const OFFERS = C('173607281');   // fallback shop page for world-categories SADKO
                                   // doesn't list yet (soundbars, heaters, …)

  const SECTIONS = [
    {
      id: 'living', label: 'غرفة المعيشة',
      still: 'assets/img/still_1.jpg',
      stillMobile: 'assets/img/m_living_tall.jpg?v=4',   // bespoke portrait scene for phones
      clip: 'assets/vid/leg_1.mp4', clipMobile: 'assets/vid/leg_1-m.mp4',
      accent: '#2e7e88',
      scroll: 1.9, linger: 0.5,
      copyY: 0.46,      // mid-height: clears the top-right AC and the bottom heaters
      mCopyX: 0.50, mCopyY: 0.20,   // phone: standardized top-centre position (same in every room)
      eyebrow: 'بيتك بالكامل من صادكو',
      title: 'أهلاً بيك فى بيت صادكو',
      showcase: 0.03,   // the landing frame — the whole entertainment + climate room
      // fx/fy = desktop 16:9 frame; mfx/mfy = the portrait m_living_tall.jpg — each one
      // measured on the appliance itself in that picture, so the marker rides the
      // product (the image is drawn cover + centred; being 9:21 it is taller than any
      // phone, so only its ceiling/floor are trimmed and no appliance is ever cut).
      hotspots: [       // coords measured on the settle frame (sc_living @0.46s)
        { fx: 0.500, fy: 0.514, at: 0.06, span: 0.30, mfx: 0.510, mfy: 0.484, label: 'تليفزيونات', href: C('38022381') },
        { fx: 0.413, fy: 0.606, at: 0.06, span: 0.30, mfx: 0.518, mfy: 0.534, label: 'أنظمة صوت وترفيه', href: OFFERS },
        { fx: 0.885, fy: 0.167, at: 0.06, span: 0.30, mfx: 0.873, mfy: 0.379, label: 'تكييفات هواء', href: C('38032005') },
        { fx: 0.619, fy: 0.648, at: 0.12, span: 0.32, sfx: 0.619, sfy: 0.648, mfx: 0.747, mfy: 0.597, label: 'مراوح ومبردات هواء', href: C('50318054') },
        { fx: 0.773, fy: 0.815, at: 0.12, span: 0.32, sfx: 0.773, sfy: 0.815, mfx: 0.620, mfy: 0.672, label: 'دفايات', href: OFFERS },
        { fx: 0.060, fy: 0.690, at: 0.20, span: 0.32, sfx: 0.060, sfy: 0.690, mfx: 0.161, mfy: 0.567, label: 'تنقية وترطيب الهواء', href: OFFERS },
        { fx: 0.371, fy: 0.597, at: 0.20, span: 0.32, sfx: 0.371, sfy: 0.597, mfx: 0.340, mfy: 0.525, label: 'مبردات مياه', href: C('102858075') },
      ],
      // portrait spots, in the order above: wall TV · soundbar under it · split AC
      // top-right · pedestal fan · oil radiator · diffuser on the left console ·
      // water dispenser beside the dining table.
    },
    {
      id: 'kitchen', label: 'المطبخ',
      still: 'assets/img/still_2.jpg',
      stillMobile: 'assets/img/m_kitchen_tall.jpg?v=4',
      clip: 'assets/vid/leg_2.mp4', clipMobile: 'assets/vid/leg_2-m.mp4',
      accent: '#c97b12',
      scroll: 2.1, linger: 0.5,
      copyY: 0.24,      // top: every marker (fridges right, counter left) sits lower-half

      showcase: 0.92,   // the settle: full counter line-up + cooker wall + cold corner
      // mfx/mfy read off m_kitchen_tall.jpg: the back-counter line-up runs left→right
      // exactly as it does on the desktop counter (microwave · island blender ·
      // coffee machine · air fryer · toaster · stand mixer · food processor ·
      // juicer · grill press), then dishwasher, range, hood, the cold corner on
      // the right, and the two big gadgets standing on the near island.
      hotspots: [
        { fx: 0.098, fy: 0.638, at: 0.92, span: 0.26, mfx: 0.108, mfy: 0.543, label: 'ميكروييف', href: C('57646037') },
        { fx: 0.180, fy: 0.574, at: 0.92, span: 0.26, mfx: 0.139, mfy: 0.634, label: 'خلاطات', href: C('68782006') },
        { fx: 0.218, fy: 0.607, at: 0.92, span: 0.26, mfx: 0.250, mfy: 0.509, label: 'كاتيل وماكينات قهوة', href: C('185355010') },
        { fx: 0.333, fy: 0.551, at: 0.92, span: 0.26, mfx: 0.325, mfy: 0.518, label: 'قلايات', href: C('185364502') },
        { fx: 0.378, fy: 0.570, at: 0.92, span: 0.26, mfx: 0.366, mfy: 0.527, label: 'أجهزة صغيرة', href: C('112439376') },
        { fx: 0.424, fy: 0.565, at: 0.92, span: 0.26, mfx: 0.430, mfy: 0.509, label: 'عجانات', href: C('68782006') },
        { fx: 0.494, fy: 0.546, at: 0.92, span: 0.26, mfx: 0.498, mfy: 0.515, label: 'محضرات طعام', href: C('68782006') },
        { fx: 0.538, fy: 0.546, at: 0.92, span: 0.26, mfx: 0.548, mfy: 0.504, label: 'عصارات', href: C('112439376') },
        { fx: 0.594, fy: 0.570, at: 0.92, span: 0.26, mfx: 0.605, mfy: 0.525, label: 'جريل وتوستر', href: C('112439376') },
        { fx: 0.346, fy: 0.722, at: 0.92, span: 0.26, mfx: 0.341, mfy: 0.567, label: 'غسالات أطباق', href: C('38022354') },
        { fx: 0.494, fy: 0.700, at: 0.92, span: 0.26, mfx: 0.509, mfy: 0.565, label: 'أفران وبوتاجازات', href: C('38003799') },
        { fx: 0.497, fy: 0.398, at: 0.92, span: 0.26, mfx: 0.501, mfy: 0.477, label: 'شفاطات', href: C('38003799') },
        { fx: 0.813, fy: 0.574, at: 0.92, span: 0.26, mfx: 0.773, mfy: 0.511, label: 'ثلاجات', href: C('38003882') },
        { fx: 0.903, fy: 0.607, at: 0.92, span: 0.26, mfx: 0.719, mfy: 0.645, label: 'حلل كهربائية ومفارم', href: C('112439376') },
        { fx: 0.909, fy: 0.750, at: 0.92, span: 0.26, mfx: 0.833, mfy: 0.577, label: 'فريزرات', href: C('38005648') },
      ],
    },
    {
      id: 'laundry', label: 'غرفة الغسيل',
      still: 'assets/img/still_3.jpg',
      stillMobile: 'assets/img/m_laundry_tall.jpg',
      clip: 'assets/vid/leg_3.mp4', clipMobile: 'assets/vid/leg_3-m.mp4',
      accent: '#3d7f9e',
      scroll: 1.8, linger: 0.45,
      // Both side walls of this room are packed (ironing corner left, washer bay +
      // heaters + shelving right), so the copy goes on the one big bare patch:
      // the wall above the washer/dryer counter. Same spot in both languages.
      copyX: 0.55, copyY: 0.22,
      mCopyX: 0.50, mCopyY: 0.20,   // phone: standardized top-centre position (same in every room)
      eyebrow: 'ركن الغسيل والعناية',
      title: 'غسيل وتجفيف ونضافة… وكل حاجة معاها',
      showcase: 0.50,   // the full-room view: fabric care, cleaning trio, heaters, shelves
      // Coords read off the actual showcase frame (leg_3.mp4 @ 4.02s, 1920×1080).
      // The portrait m_laundry_tall.jpg has ONE machine: washer + dryer markers both sit
      // on it, side by side (the user's request).
      // Portrait order: the machine's left half · its right half · gas boiler ·
      // electric water heater · iron on the board · steamer head · canister
      // vacuum · robot vacuum on the floor · sewing machine · hair dryer.
      hotspots: [
        { fx: 0.655, fy: 0.699, at: 0.50, span: 0.28, mfx: 0.614, mfy: 0.603, label: 'غسالات ملابس', href: C('38003963') },
        { fx: 0.549, fy: 0.699, at: 0.50, span: 0.28, mfx: 0.716, mfy: 0.603, label: 'مجففات ملابس', href: C('38005652') },
        { fx: 0.760, fy: 0.269, at: 0.50, span: 0.28, mfx: 0.710, mfy: 0.391, label: 'سخانات غاز', href: C('48143206') },
        { fx: 0.836, fy: 0.167, at: 0.50, span: 0.28, mfx: 0.839, mfy: 0.322, label: 'سخانات كهرباء', href: C('48149056') },
        { fx: 0.258, fy: 0.560, at: 0.50, span: 0.28, mfx: 0.201, mfy: 0.525, label: 'مكاوى', href: C('81167227') },
        { fx: 0.321, fy: 0.375, at: 0.50, span: 0.28, mfx: 0.333, mfy: 0.429, label: 'مكاوى بخار وستيمر', href: C('81167227') },
        { fx: 0.379, fy: 0.694, at: 0.50, span: 0.28, mfx: 0.428, mfy: 0.604, label: 'مكانس', href: C('81170222') },
        { fx: 0.464, fy: 0.497, at: 0.50, span: 0.28, mfx: 0.406, mfy: 0.645, label: 'مكانس روبوت وعمودية', href: C('81170222') },
        { fx: 0.846, fy: 0.540, at: 0.50, span: 0.28, mfx: 0.843, mfy: 0.510, label: 'ماكينات خياطة', href: OFFERS },
        { fx: 0.747, fy: 0.546, at: 0.50, span: 0.28, mfx: 0.903, mfy: 0.525, label: 'عناية شخصية', href: C('112439376') },
      ],
    },
    {
      id: 'family', label: 'أوضة العروض',
      still: 'assets/img/still_4.jpg',
      stillMobile: 'assets/img/m_offers_tall.jpg',
      clip: 'assets/vid/leg_4.mp4', clipMobile: 'assets/vid/leg_4-m.mp4',
      accent: '#8a6242',
      scroll: 2.0, linger: 0.55,
      copyY: 0.64,      // low: the offers board sits in the upper third
      mCopyX: 0.50, mCopyY: 0.20,   // phone: standardized top-centre position (same in every room)
      eyebrow: 'حكاية عيلة من 1961',
      title: 'عروض وإعلانات',
      showcase: 0.88,   // the gallery-wall hold
      showcaseLabel: 'شوف العروض',
      // No pulsing markers here: the single rotating offers board (mountPosters
      // slots below) IS the room's interactive element — deals cycle through it
      // with side arrows, so per-category dots would only clutter the board.
      hotspots: [],
    },
  ];

  /* ---- English mode: overlay the scene copy (labels, titles, hotspot names)
     onto the Arabic-authored config. Language comes from nav.js (skLang). ---- */
  const EN = !!(window.skLang && window.skLang.get() === 'en');
  if (EN) {
    document.documentElement.lang = 'en';
    document.documentElement.dir = 'ltr';
    document.title = 'SADKO Group — Your Whole Home';
    const L = {
      living: { label: 'Living Room', eyebrow: 'Your whole home from SADKO', title: 'Welcome to the SADKO house',
        spots: ['TVs', 'Sound & entertainment', 'Air conditioners', 'Fans & air coolers', 'Space heaters', 'Air purifiers & humidifiers', 'Water dispensers'] },
      kitchen: { label: 'Kitchen', eyebrow: 'The heart of the home', title: 'A kitchen with everything… literally',
        spots: ['Microwaves', 'Blenders', 'Kettles & coffee machines', 'Air fryers', 'Small appliances', 'Dough mixers', 'Food processors', 'Juicers', 'Grills & toasters', 'Dishwashers', 'Ovens & cookers', 'Hoods', 'Refrigerators', 'Electric pots & choppers', 'Freezers'] },
      laundry: { label: 'Laundry Room', eyebrow: 'Laundry & care corner', title: 'Washing, drying, cleaning… and everything with it',
        // no anchor override: this room's copy sits on the bare centre wall in
        // both languages (copyX/copyY above), since both side walls are packed
        spots: ['Washing machines', 'Clothes dryers', 'Gas water heaters', 'Electric water heaters', 'Irons', 'Steam irons & steamers', 'Vacuum cleaners', 'Robot & stick vacuums', 'Sewing machines', 'Personal care'] },
      family: { label: 'Offers Room', eyebrow: 'A family story since 1961', title: 'Offers and Advertisements',
        showcaseLabel: 'See the offers',
        spots: ['SADKO offers', 'Best sellers', 'Special discount'] },
    };
    for (const s of SECTIONS) {
      const e = L[s.id]; if (!e) continue;
      s.label = e.label; s.eyebrow = e.eyebrow; s.title = e.title;
      if (e.copyY != null) s.copyY = e.copyY;   // English copy sits on the left; some rooms need a different anchor
      if (e.showcaseLabel) s.showcaseLabel = e.showcaseLabel;
      (s.hotspots || []).forEach((h, i) => { if (e.spots[i]) h.label = e.spots[i]; });
      if (s.cta && e.cta) { s.cta.primary.label = e.cta.primary; s.cta.secondary.label = e.cta.secondary; }
    }
  }

  const api = mountScrollWorld(document.getElementById('world'), {
    nav: false,               // core-pages strap comes from nav.js; rooms live in the dock
    hint: EN ? 'Scroll to enter the house' : 'اسحب لتدخل البيت',
    diveScroll: 1.5,
    connScroll: 0.9,
    crossfade: 0.1,
    sections: SECTIONS,
    connectors: [],            // architecture A: legs chain directly, no connectors
    connectorsMobile: [],
    // Portrait phones: a real room→room camera walk between each pair of rooms,
    // scrubbed by scroll (replaces the old cross-dissolve). Each clip is 9:21 and
    // frame-locked to the tall stills either side of it — clip N runs from
    // sections[N] to sections[N+1], so this array is sections.length - 1 long.
    transitionsMobile: [
      'assets/vid/m_conn1.mp4?v=4',   // living  → kitchen
      'assets/vid/m_conn2.mp4?v=4',   // kitchen → laundry
      'assets/vid/m_conn3.mp4',   // laundry → offers
    ],
    mTransScroll: 1.2,           // viewport-heights of scroll each transition spans
  });

  mountHotspots(document.getElementById('world'), api, SECTIONS);

  // Rotating offers inside the family-room picture frames (the three blank
  // canvases of the gallery wall at the section's settle band).
  mountPosters(document.getElementById('world'), api, 3, {
    at: 0.88, span: 0.40,
    slots: [
      { fx: 0.252, fy: 0.236, fw: 0.160, fh: 0.319 },
      { fx: 0.426, fy: 0.236, fw: 0.150, fh: 0.319 },
      { fx: 0.596, fy: 0.236, fw: 0.159, fh: 0.319 },
    ],
    // The portrait m_offers_tall.jpg frames the same gallery wall — its three blank
    // canvases sit at these rects (fractions of the portrait picture).
    slotsMobile: [
      { fx: 0.291, fy: 0.312, fw: 0.140, fh: 0.166 },
      { fx: 0.435, fy: 0.311, fw: 0.136, fh: 0.167 },
      { fx: 0.575, fy: 0.310, fw: 0.120, fh: 0.168 },
    ],
    // Phone: make the board much bigger than the panels — stretch it out to reach
    // roughly halfway into the left and right shelves so it reads clearly.
    boardMobile: { fx: 0.145, fy: 0.377, fw: 0.711, fh: 0.156 },
    feeds: [
      { href: C('173607281'), badge: EN ? 'SADKO offers' : 'عروض صادكو', categoryIds: [38022381, 38032005, 38003882, 112439376, 38003963] },
      { href: C('195273251'), badge: EN ? 'Best sellers' : 'الأكثر مبيعاً', categoryIds: [38003882, 38022381, 40507239, 81170222, 185355010] },
      { href: C('173607281'), badge: EN ? 'Special discount' : 'خصم خاص', categoryIds: [38003799, 38005648, 50318054, 57646037, 185364502] },
    ],
  });

  mountGuide(document.getElementById('world'), api, SECTIONS);
  window.__swApi = api;   // exposed for QA tooling (?spots etc.)
});
</script>
</body>
</html>
