<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صادكو جروب | منزلك بالكامل</title>
<meta name="description" content="تجوّل داخل منزل صادكو: كل فئات الأجهزة الكهربائية فى ثلاث غرف، وفى نهايتها تدخل المتجر مباشرةً. اضغط على أى جهاز وتسوّق من فئته مباشرةً.">
<link rel="icon" href="assets/img/sadko-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<script src="assets/js/scrub-engine.js?v=g30" defer></script>
<script src="assets/js/nav.js?v=g29" defer></script>
<script src="assets/js/catalog-i18n.js?v=g3" defer></script>
<script src="assets/js/hotspots.js?v=g45" defer></script>
<script src="assets/js/guide.js?v=g11" defer></script>
<link rel="stylesheet" href="assets/css/site.css?v=g14">
</head>
<body>
<div id="world"></div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  const C = id => `category/${id}.html`;

  /* Marker destinations, named rather than repeated as raw ids.

     The scraped catalogue files every product under a COARSE category id, but
     build-category-pages.mjs generated a fine-grained page per menu entry — so
     pages like ميكروييف (57646037), غسالات ملابس (38003963), سخانات غاز
     (48143206), مكاوى (81167227) and مكانس (81170222) exist, are correctly
     titled, and hold nothing: their id appears on no product. Eighteen of the
     thirty-one markers pointed at one of those, or at عروض صادكو (173607281)
     which is empty too — so tapping an appliance opened a shop page with no
     appliances on it.

     Each marker now points at the category its products are actually filed
     under. Verified by rendering every page and counting cards rather than by
     reading ids: the ten below render a full page, the ones they replaced
     render zero.

     The fine-grained ids are deliberately NOT kept as a fallback — an empty
     page is worse than a broader one. If the catalogue is re-scraped with
     finer categoryIds, point these constants back at them. */
  const TVS        = C('38022381');    // تليفزيونات — 32
  const AC         = C('38032005');    // تكييفات هواء — 35
  const CLIMATE    = C('50318054');    // مبردات هواء ومراوح — 28, incl. the oil heater and the hoods
  const WATER_DISP = C('102858075');   // مبردات مياه — 10
  const SMALL      = C('112439376');   // أجهزة صغيرة — 157: microwaves 12, blenders 26,
                                       // kettles/coffee 18, fryers 4, irons 14, vacuums 14…
  const COOKING    = C('38003799');    // أفران وبوتاجازات — 35
  const FRIDGES    = C('38003882');    // ثلاجات — 76
  const FREEZERS   = C('38005648');    // فريزرات — 22
  const LAUNDRY    = C('38005652');    // غسالات — 49, incl. 8 dishwashers and the dryers
  const WATER_HEAT = C('40507239');    // سخانات مياه — 27: 9 gas, 11 electric

  /* Three labels have NO matching product anywhere in the catalogue: sound
     systems, air purifiers/humidifiers and sewing machines. They now open the
     nearest stocked neighbour — entertainment, air treatment, small appliances
     — rather than an empty page, but that IS an approximation. Stock those
     lines, or drop those three markers, and this note stops being true. */

  const SECTIONS = [
    {
      id: 'living', label: 'غرفة المعيشة',
      // ?v=2: the file was re-cut from leg_1.mp4 at 0.46s (this room's showcase
      // frame, the one the marker coords below were measured on). It used to be
      // the clip's OPENING frame — a wider shot — so while the 12MB flight
      // downloaded, the poster on screen was not the frame the markers belong to
      // and several of them sat off their appliances until the video arrived.
      still: 'assets/img/still_1.jpg?v=2',
      stillMobile: 'assets/img/m_living.jpg?v=2',   // bespoke portrait scene for phones
      clip: 'assets/vid/leg_1.mp4', clipMobile: 'assets/vid/leg_1-m.mp4',
      accent: '#2e7e88',
      scroll: 1.9, linger: 0.5,
      copyY: 0.46,      // mid-height: clears the top-right AC and the bottom heaters
      mCopyX: 0.50, mCopyY: 0.20,   // phone: standardized top-centre position (same in every room)
      eyebrow: 'بيتك بالكامل من صادكو',
      title: 'أهلاً بك فى منزل صادكو',
      showcase: 0.03,   // the landing frame — the whole entertainment + climate room
      // ...and the page OPENS on it (hotspots.js). The marker coords below were
      // measured on this exact frame, so landing anywhere else shows them off
      // their appliances — which is why the room used to need its dock button
      // clicked before it looked right.
      openShowcase: true,
      // fx/fy = desktop 16:9 frame; mfx/mfy = the portrait m_living.jpg (same appliances)
      hotspots: [       // coords measured on the settle frame (sc_living @0.46s)
        // Every marker anchors at 0.03 — the section progress that IS that frame,
        // and the frame this page opens on. They used to be spread over 0.06/0.12/
        // 0.20 as if each appliance were framed at a different moment of the flight,
        // but all seven coordinates were measured on the one frame: stepped through
        // leg_1.mp4, the air-purifier mark lands on a bare wall by 1.6s and the water
        // cooler drifts off by 2.4s. Anchoring them together is what makes the room
        // read correctly on its own, without depending on showcase mode being on —
        // so a reload, a language switch or a Back all still show the full room.
        { fx: 0.500, fy: 0.514, at: 0.03, span: 0.30, mfx: 0.510, mfy: 0.490, label: 'تليفزيونات', href: TVS },
        { fx: 0.413, fy: 0.606, at: 0.03, span: 0.30, mfx: 0.617, mfy: 0.531, label: 'أنظمة صوت وترفيه', href: TVS },
        { fx: 0.885, fy: 0.167, at: 0.03, span: 0.30, mfx: 0.869, mfy: 0.388, label: 'تكييفات هواء', href: AC },
        { fx: 0.619, fy: 0.648, at: 0.03, span: 0.32, sfx: 0.619, sfy: 0.648, mfx: 0.687, mfy: 0.555, label: 'مراوح ومبردات هواء', href: CLIMATE },
        { fx: 0.773, fy: 0.815, at: 0.03, span: 0.32, sfx: 0.773, sfy: 0.815, mfx: 0.614, mfy: 0.672, label: 'دفايات', href: CLIMATE },
        { fx: 0.060, fy: 0.690, at: 0.03, span: 0.32, sfx: 0.060, sfy: 0.690, mfx: 0.163, mfy: 0.564, label: 'تنقية وترطيب الهواء', href: CLIMATE },
        { fx: 0.371, fy: 0.597, at: 0.03, span: 0.32, sfx: 0.371, sfy: 0.597, mfx: 0.343, mfy: 0.531, label: 'مبردات مياه', href: WATER_DISP },
      ],
    },
    {
      id: 'kitchen', label: 'المطبخ',
      still: 'assets/img/still_2.jpg',
      stillMobile: 'assets/img/m_kitchen.jpg?v=2',
      clip: 'assets/vid/leg_2.mp4', clipMobile: 'assets/vid/leg_2-m.mp4',
      accent: '#c97b12',
      scroll: 2.1, linger: 0.5,
      copyY: 0.24,      // top: every marker (fridges right, counter left) sits lower-half
      copyAt: 0.92,     // peak the copy ON the settle frame (= showcase), not mid-flight:
                        // this room settles late, so a mid-section peak had the title
                        // shouting on the way in and faded out by the view it describes
      mCopyX: 0.50, mCopyY: 0.20,   // phone: standardized top-centre position (same in every room)
      eyebrow: 'قلب المنزل',
      title: 'مطبخ فيه كل شىء… حرفياً',
      showcase: 0.92,   // the settle: full counter line-up + cooker wall + cold corner
      hotspots: [
        { fx: 0.098, fy: 0.638, at: 0.92, span: 0.26, mfx: 0.088, mfy: 0.539, label: 'ميكروييف', href: SMALL },
        { fx: 0.180, fy: 0.574, at: 0.92, span: 0.26, mfx: 0.146, mfy: 0.625, label: 'خلاطات', href: SMALL },
        { fx: 0.218, fy: 0.607, at: 0.92, span: 0.26, mfx: 0.240, mfy: 0.523, label: 'كاتيل وماكينات قهوة', href: SMALL },
        { fx: 0.333, fy: 0.551, at: 0.92, span: 0.26, mfx: 0.331, mfy: 0.514, label: 'قلايات', href: SMALL },
        { fx: 0.378, fy: 0.570, at: 0.92, span: 0.26, mfx: 0.381, mfy: 0.517, label: 'أجهزة صغيرة', href: SMALL },
        { fx: 0.424, fy: 0.565, at: 0.92, span: 0.26, mfx: 0.426, mfy: 0.512, label: 'عجانات', href: SMALL },
        { fx: 0.494, fy: 0.546, at: 0.92, span: 0.26, mfx: 0.505, mfy: 0.512, label: 'محضرات طعام', href: SMALL },
        { fx: 0.538, fy: 0.546, at: 0.92, span: 0.26, mfx: 0.547, mfy: 0.509, label: 'عصارات', href: SMALL },
        { fx: 0.594, fy: 0.570, at: 0.92, span: 0.26, mfx: 0.600, mfy: 0.520, label: 'جريل وتوستر', href: SMALL },
        { fx: 0.346, fy: 0.722, at: 0.92, span: 0.26, mfx: 0.349, mfy: 0.540, label: 'غسالات أطباق', href: LAUNDRY },
        { fx: 0.494, fy: 0.700, at: 0.92, span: 0.26, mfx: 0.507, mfy: 0.536, label: 'أفران وبوتاجازات', href: COOKING },
        { fx: 0.497, fy: 0.398, at: 0.92, span: 0.26, mfx: 0.501, mfy: 0.469, label: 'شفاطات', href: COOKING },
        { fx: 0.813, fy: 0.574, at: 0.92, span: 0.26, mfx: 0.817, mfy: 0.521, label: 'ثلاجات', href: FRIDGES },
        { fx: 0.903, fy: 0.607, at: 0.92, span: 0.26, mfx: 0.870, mfy: 0.630, label: 'حلل كهربائية ومفارم', href: SMALL },
        { fx: 0.909, fy: 0.750, at: 0.92, span: 0.26, mfx: 0.884, mfy: 0.560, label: 'فريزرات', href: FREEZERS },
      ],
    },
    {
      id: 'laundry', label: 'غرفة الغسيل',
      still: 'assets/img/still_3.jpg',
      stillMobile: 'assets/img/m_laundry.jpg?v=2',
      clip: 'assets/vid/leg_3.mp4', clipMobile: 'assets/vid/leg_3-m.mp4',
      accent: '#3d7f9e',
      scroll: 1.8, linger: 0.45,
      // Both side walls of this room are packed (ironing corner left, washer bay +
      // heaters + shelving right), so the copy goes on the one big bare patch:
      // the wall above the washer/dryer counter. Same spot in both languages.
      copyX: 0.55, copyY: 0.22,
      mCopyX: 0.50, mCopyY: 0.20,   // phone: standardized top-centre position (same in every room)
      eyebrow: 'ركن الغسيل والعناية',
      title: 'غسيل وتجفيف ونظافة… وكل ما يلزمها',
      showcase: 0.50,   // the full-room view: fabric care, cleaning trio, heaters, shelves
      // Coords read off the actual showcase frame (leg_3.mp4 @ 4.02s, 1920×1080).
      // The portrait m_laundry.jpg has ONE machine: washer + dryer markers both sit
      // on it, side by side (the user's request).
      hotspots: [
        { fx: 0.655, fy: 0.699, at: 0.50, span: 0.28, mfx: 0.659, mfy: 0.599, label: 'غسالات ملابس', href: LAUNDRY },
        { fx: 0.549, fy: 0.699, at: 0.50, span: 0.28, mfx: 0.700, mfy: 0.548, label: 'مجففات ملابس', href: LAUNDRY },
        { fx: 0.760, fy: 0.269, at: 0.50, span: 0.28, mfx: 0.699, mfy: 0.380, label: 'سخانات غاز', href: WATER_HEAT },
        { fx: 0.836, fy: 0.167, at: 0.50, span: 0.28, mfx: 0.851, mfy: 0.323, label: 'سخانات كهرباء', href: WATER_HEAT },
        { fx: 0.258, fy: 0.560, at: 0.50, span: 0.28, mfx: 0.215, mfy: 0.529, label: 'مكاوى', href: SMALL },
        { fx: 0.321, fy: 0.375, at: 0.50, span: 0.28, mfx: 0.334, mfy: 0.432, label: 'مكاوى بخار وستيمر', href: SMALL },
        { fx: 0.379, fy: 0.694, at: 0.50, span: 0.28, mfx: 0.456, mfy: 0.573, label: 'مكانس', href: SMALL },
        { fx: 0.464, fy: 0.497, at: 0.50, span: 0.28, mfx: 0.410, mfy: 0.630, label: 'مكانس روبوت وعمودية', href: SMALL },
        { fx: 0.846, fy: 0.540, at: 0.50, span: 0.28, mfx: 0.845, mfy: 0.518, label: 'ماكينات خياطة', href: SMALL },
      ],
    },
    {
      // The offers room is gone. This last section is the hand-off to the shop:
      // the laundry flight starts, and is CUT before it arrives — clipEnd 0.30 is
      // just under the frame where the old room's gallery wall first reads
      // (frame 42 of 151 = 0.28), so the reader never sees a room they cannot
      // enter. From `outro.from` the stage fades out and the browser goes to
      // shop.html. See the outro block in scrub-engine.js for the two guards.
      id: 'shop', label: 'المتجر',
      href: 'shop.html',            // the dock button navigates instead of framing
      // still_shop.jpg is leg_4 at exactly clipEnd (1.109s of 5.042s) — the doorway
      // out of the laundry, before the offers room resolves. It MUST match the cut:
      // the still is what shows until the clip decodes, so still_4.jpg (the offers
      // room itself) put the deleted room straight back on screen.
      still: 'assets/img/still_shop.jpg',
      // Portrait has no video to cut, so it must not use the offers-room still at
      // all — it holds the laundry frame and dissolves straight into the fade.
      stillMobile: 'assets/img/m_laundry.jpg?v=2',
      clip: 'assets/vid/leg_4.mp4', clipMobile: 'assets/vid/leg_4-m.mp4',
      clipEnd: 0.22,
      accent: '#8a6242',
      scroll: 1.1, linger: 0,
      copyY: 0.5,
      mCopyX: 0.50, mCopyY: 0.20,
      eyebrow: 'كل ما رأيته… وأكثر',
      title: 'ادخل المتجر',
      showcase: 0.22,
      showcaseLabel: 'تسوّق كل المنتجات',
      hotspots: [],
    },
  ];

  /* ---- English mode: overlay the scene copy (labels, titles, hotspot names)
     onto the Arabic-authored config. Language comes from nav.js (skLang). ---- */
  const EN = !!(window.skLang && window.skLang.get() === 'en');
  if (EN) {
    document.documentElement.lang = 'en';
    document.documentElement.dir = 'ltr';
    document.title = 'SADKO Group | Your Whole Home';
    const L = {
      living: { label: 'Living Room', eyebrow: 'Your whole home from SADKO', title: 'Welcome to the SADKO house',
        spots: ['TVs', 'Sound & entertainment', 'Air conditioners', 'Fans & air coolers', 'Space heaters', 'Air purifiers & humidifiers', 'Water dispensers'] },
      kitchen: { label: 'Kitchen', eyebrow: 'The heart of the home', title: 'A kitchen with everything… literally',
        spots: ['Microwaves', 'Blenders', 'Kettles & coffee machines', 'Air fryers', 'Small appliances', 'Dough mixers', 'Food processors', 'Juicers', 'Grills & toasters', 'Dishwashers', 'Ovens & cookers', 'Hoods', 'Refrigerators', 'Electric pots & choppers', 'Freezers'] },
      laundry: { label: 'Laundry Room', eyebrow: 'Laundry & care corner', title: 'Washing, drying, cleaning… and everything with it',
        // no anchor override: this room's copy sits on the bare centre wall in
        // both languages (copyX/copyY above), since both side walls are packed
        spots: ['Washing machines', 'Clothes dryers', 'Gas water heaters', 'Electric water heaters', 'Irons', 'Steam irons & steamers', 'Vacuum cleaners', 'Robot & stick vacuums', 'Sewing machines'] },
      shop: { label: 'Shop', eyebrow: 'Everything you just saw… and more', title: 'Enter the shop',
        showcaseLabel: 'Shop all products',
        spots: [] },
    };
    for (const s of SECTIONS) {
      const e = L[s.id]; if (!e) continue;
      s.label = e.label; s.eyebrow = e.eyebrow; s.title = e.title;
      if (e.copyY != null) s.copyY = e.copyY;   // English copy sits on the left; some rooms need a different anchor
      if (e.showcaseLabel) s.showcaseLabel = e.showcaseLabel;
      (s.hotspots || []).forEach((h, i) => { if (e.spots[i]) h.label = e.spots[i]; });
      if (s.cta && e.cta) { s.cta.primary.label = e.cta.primary; s.cta.secondary.label = e.cta.secondary; }
    }
  }

  const api = mountScrollWorld(document.getElementById('world'), {
    nav: false,               // core-pages strap comes from nav.js; rooms live in the dock
    route: false,             // no side dot rail: it runs down the right edge, which is
                              // exactly where the edge-anchored appliance markers sit (the
                              // AC and the fan in the living room, the fridge column in the
                              // kitchen), so the two overlapped and the rail stole the taps.
                              // The dock already names the room you are in, so it said
                              // nothing the dock wasn't already saying.
    hint: EN ? 'Scroll to enter the house' : 'تجوّل لتدخل المنزل',
    diveScroll: 1.5,
    connScroll: 0.9,
    crossfade: 0.1,
    sections: SECTIONS,
    // Hand off to the shop at the end of the last (cut) leg. `from` is the point
    // in that section's scroll where the fade begins; it completes at the end of
    // the section, and that is when the browser follows `href`.
    outro: { href: 'shop.html', from: 0.55 },
    // DESKTOP: architecture A — the 16:9 legs chain directly, no connectors.
    connectors: [],
    // PORTRAIT PHONES: the rooms there are fitted portrait IMAGES, not the 16:9
    // flight, so without these the whole journey was one static room dissolving
    // into the next with no camera movement at all. These are portrait-shot
    // (822x1920) room-to-room walks whose endpoints are the neighbouring room
    // scenes, so the movement joins up. They cost a desktop visitor nothing: a
    // connector with no landscape clip is collapsed to zero scroll and never
    // fetched off portrait (see scrub-engine layout() / loadClip()).
    //
    // The third slot is deliberately null. A laundry->offers walk exists
    // (m_conn3.mp4) but it lands in the offers room, which this flow no longer
    // has — the last section is the shop hand-off, which holds the laundry
    // scene and dissolves out on purpose.
    connectorsMobile: [
      'assets/vid/m_conn1.mp4',   // living -> kitchen
      'assets/vid/m_conn2.mp4',   // kitchen -> laundry
      null,                       // laundry -> shop: the deliberate fade-out
    ],
  });

  mountHotspots(document.getElementById('world'), api, SECTIONS);

  // The rotating offers board used to hang on the family room's gallery wall.
  // That room is no longer reached — the flight is cut before it — so there is
  // nothing to mount it onto. Its content lives on in the shop's own "Hot offers"
  // and "Best sellers" rails, which are built from the same SADKO source lists
  // (see data/collections.json).

  mountGuide(document.getElementById('world'), api, SECTIONS);
  window.__swApi = api;   // exposed for QA tooling (?spots etc.)
});
</script>
</body>
</html>
