<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خطط التجهيز — صادكو جروب</title>
<meta name="description" content="اعمل قايمة تجهيز البيت جهاز جهاز: تختار الفئات اللى محتاجها، تحط لكل فئة خيارات وتحدد واحد، وتشوف الإجمالى مقابل ميزانيتك — وتشارك الخطة مع أهلك بلينك.">
<link rel="icon" href="assets/img/sadko-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css?v=a6">
<style>
/* page-specific bits the shared sheet doesn't cover */
.pl-scroll { overflow-x: auto; }
.pl-pick { display: flex; gap: 10px; align-items: center; }
.pl-pick img { width: 46px; height: 46px; object-fit: contain; background: #fff;
  border: 1px solid var(--line); border-radius: 10px; flex: 0 0 auto; padding: 3px; }
.pl-t { font-weight: 800; font-size: .86rem; line-height: 1.45; max-width: 34ch;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pl-acts { display: flex; flex-wrap: wrap; gap: 6px; }
.pl-num { font-weight: 900; font-size: 1.4rem; line-height: 1.2; display: block; }
.pl-opt { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  border: 1px solid var(--line); border-radius: 12px; padding: 8px 11px; background: #fff; }
.pl-opt img { width: 40px; height: 40px; object-fit: contain; }
.pl-tpl { text-align: start; align-items: stretch; }
</style>
</head>
<body>

<section class="phero">
  <div class="phero__inner">
    <p class="phero__crumb"><a href="index.html" data-i18n="crumb-home">البيت</a> ← <span data-i18n="crumb-here">خطط التجهيز</span></p>
    <h1 class="phero__title" data-i18n="title">خطط التجهيز</h1>
    <p class="phero__sub" data-i18n="sub">قايمة شراء لتجهيز البيت، فئة فئة: تختار الأجهزة اللى محتاجها، تحط لكل واحدة الخيارات اللى بتقارن بينها،
      تحدد واحد فى الآخر، وتشوف الإجمالى مقابل ميزانيتك أول بأول. تقدر كمان <strong>تشارك الخطة بلينك</strong> مع أهلك عشان يشوفوها ويقولوا رأيهم.</p>
  </div>
</section>

<main class="wrap" id="plan-root">
  <div class="empty" data-i18n="loading">جارى التحميل…</div>
</main>

<footer data-footer></footer>

<script src="assets/js/nav.js?v=g17" defer></script>
<script src="assets/js/appshell.js?v=a4" defer></script>
<script src="assets/js/specs.js?v=a4" defer></script>
<script src="assets/js/store.js?v=a4" defer></script>
<script src="assets/js/auth.js?v=a4" defer></script>
<script src="assets/js/homes.js?v=a4" defer></script>
<script src="assets/js/prefs.js?v=a4" defer></script>
<script src="assets/js/plan.js?v=a4" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const T = {
    'crumb-home': 'Home', 'crumb-here': 'Shopping plans',
    'title': 'Shopping plans',
    'sub': 'A buying checklist for kitting out a home, category by category: pick the appliances you need, keep the candidates you are comparing under each one, choose a winner, and watch the running total against your budget. You can also <strong>share the plan as a link</strong> so your family can look at it and weigh in.',
    'loading': 'Loading…',
  };
  if (window.skLang && window.skLang.get() === 'en') {
    document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr';
    document.title = 'Shopping plans — SADKO Group';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n'); if (T[k]) el.innerHTML = T[k];
    });
  }
  skApp.footer();
  mountPlan(document.getElementById('plan-root'));
});
</script>
</body>
</html>
