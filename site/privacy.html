<script>
window.addEventListener('DOMContentLoaded', () => {
  const T = {
    'crumb-home': 'Home', 'crumb-here': 'Privacy',
    'title': 'Privacy',
    'sub': 'This page describes what this site <strong>actually</strong> does with your data, not what sites usually say. An account is stored on SADKO’s own server, while your plans, saved products, appliances and cart stay in your own browser on your device, and there are no card details and no advertising trackers anywhere on the site.',

    document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr';
    document.title = 'Privacy | SADKO Group';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n'); if (T[k]) el.innerHTML = T[k];
