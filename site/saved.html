<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المنتجات المحفوظة — صادكو جروب</title>
<meta name="description" content="المنتجات اللى حفظتها عشان تقارنها وترجعلها، مع متابعة تغيّر السعر من وقت ما حفظتها.">
<link rel="icon" href="assets/img/sadko-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css?v=a6">
</head>
<body>

<section class="phero">
  <div class="phero__inner">
    <p class="phero__crumb"><a href="index.html" data-i18n="crumb-home">البيت</a> ← <span data-i18n="crumb-here">المحفوظات</span></p>
    <h1 class="phero__title" data-i18n="title">المنتجات المحفوظة</h1>
    <p class="phero__sub" data-i18n="sub">قايمة قصيرة باللى بتفكر فيه. بنقول لك السعر اتغيّر ولا لأ من وقت ما حفظته،
      وتقدر تحدد السعر اللى يناسبك كتذكير ليك.</p>
  </div>
</section>

<main class="wrap" id="saved-root">
  <div class="empty" data-i18n="loading">جارى التحميل…</div>
</main>

<footer data-footer></footer>

<script src="assets/js/nav.js?v=g18" defer></script>
<script src="assets/js/appshell.js?v=a5" defer></script>
<script src="assets/js/specs.js?v=a4" defer></script>
<script src="assets/js/store.js?v=a4" defer></script>
<script src="assets/js/auth.js?v=a4" defer></script>
<script src="assets/js/homes.js?v=a4" defer></script>
<script src="assets/js/prefs.js?v=a4" defer></script>
<script src="assets/js/saved.js?v=a4" defer></script>
<script>
window.addEventListener('DOMContentLoaded', () => {
  const T = {
    'crumb-home': 'Home', 'crumb-here': 'Saved',
    'title': 'Saved products',
    'sub': 'A short list of what you are weighing up. We tell you whether the price has changed since you saved it, and you can set the price that would suit you as your own reminder.',
    'loading': 'Loading…',
  };
  if (window.skLang && window.skLang.get() === 'en') {
    document.documentElement.lang = 'en'; document.documentElement.dir = 'ltr';
    document.title = 'Saved products — SADKO Group';
    document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (T[k]) el.innerHTML = T[k]; });
  }
  skApp.footer();
  mountSaved(document.getElementById('saved-root'));
});
</script>
</body>
</html>
