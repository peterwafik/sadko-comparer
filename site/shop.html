<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المتجر — صادكو جروب</title>
<meta name="description" content="تصفّح كل أجهزة صادكو جروب — ثلاجات، غسالات، تليفزيونات، تكييفات، أجهزة صغيرة وأكتر — بالسعر والصورة، وضيفها للسلة.">
<link rel="icon" href="assets/img/sadko-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/category.css?v=c2">
<style>
:root{--accent:#2e7e88;}
.shop-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;align-items:start;}
.side{position:sticky;top:86px;background:#fff;border-radius:16px;padding:16px;
  box-shadow:0 10px 30px rgba(20,52,58,.08);border:1px solid rgba(46,126,136,.12);}
.side h3{margin:0 0 10px;font-size:.95rem;color:#c97b12;}
.side a{display:block;font:700 .85rem 'Cairo',sans-serif;color:#14343a;text-decoration:none;
  padding:6px 8px;border-radius:9px;}
.side a:hover{background:rgba(46,126,136,.08);color:#2e7e88;}
.side a.is-on{background:#2e7e88;color:#fff;}
.side .kid{margin-right:16px;font-weight:600;font-size:.78rem;color:#5b6b6e;}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px;}
.toolbar input[type=search]{flex:1 1 220px;font:600 .9rem 'Cairo',sans-serif;padding:11px 16px;
  border-radius:999px;border:1.5px solid rgba(46,126,136,.25);background:#fff;outline:none;}
.toolbar input[type=search]:focus{border-color:#2e7e88;}
.toolbar select{font:700 .85rem 'Cairo',sans-serif;padding:10px 14px;border-radius:999px;
  border:1.5px solid rgba(46,126,136,.25);background:#fff;color:#14343a;}
.toolbar .cnt{font:700 .82rem 'Cairo',sans-serif;color:#5b6b6e;}
.loadmore{display:block;margin:26px auto 0;font:800 .95rem 'Cairo',sans-serif;color:#fff;
  background:#2e7e88;border:0;border-radius:999px;padding:13px 34px;cursor:pointer;}
.loadmore:hover{background:#1f5b63;}
@media (max-width:860px){.shop-layout{grid-template-columns:1fr;}.side{position:static;}}
html[dir=ltr] .side .kid{margin-right:0;margin-left:16px;}
</style>
</head>
<body>

<section class="hero">
  <p class="hero__crumb"><a href="index.html" data-i18n="crumbHome">البيت</a> <span data-i18n="crumbArrow">←</span> <span data-i18n="crumbHere">المتجر</span></p>
  <h1 class="hero__title" data-i18n="heroTitle">متجر صادكو</h1>
  <p class="hero__meta" id="heroMeta">كل الأجهزة فى مكان واحد</p>
</section>

<main class="wrap">
  <div class="shop-layout">
    <aside class="side" id="sideTree" aria-label="فئات المتجر"></aside>
    <div>
      <div class="toolbar">
        <input type="search" id="q" data-i18n-ph="qPh" placeholder="دوّر على جهاز… (مثلاً: ثلاجة كريازى)">
        <select id="sort">
          <option value="default" data-i18n="sortDefault">الترتيب الافتراضى</option>
          <option value="price-asc" data-i18n="sortAsc">السعر: من الأقل للأعلى</option>
          <option value="price-desc" data-i18n="sortDesc">السعر: من الأعلى للأقل</option>
        </select>
        <span class="cnt" id="cnt"></span>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden data-i18n="empty">مفيش نتايج للبحث ده — جرّب كلمة تانية.</p>
      <button class="loadmore" id="more" hidden data-i18n="more">حمّل المزيد</button>
    </div>
  </div>
</main>

<footer class="foot">
  <div class="foot__inner">
    <img src="assets/img/sadko-logo.png" alt="صادكو جروب" class="foot__logo">
    <p><span data-i18n="hotline">الخط الساخن</span> <a href="tel:19140" dir="ltr">19140</a> · <a href="mailto:csupport@sadko-group.com" dir="ltr">csupport@sadko-group.com</a></p>
    <p data-i18n="ship">توصيل مجانى داخل القاهرة والجيزة والإسكندرية · الدفع عند الاستلام أو بالبطاقة</p>
    <p class="foot__copy" data-i18n="copy">© صادكو جروب 2026 — نسخة معاد تصميمها (Rebrand Preview)</p>
  </div>
</footer>

<script src="assets/js/catalog-i18n.js?v=g2" defer></script>
<script src="assets/js/nav.js?v=g15" defer></script>
<script src="assets/js/shop.js?v=g3" defer></script>
</body>
</html>
